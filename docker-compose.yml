name: codepad-lite

services:
  # ---------------------------------------------------------------
  # 代码执行引擎：自托管 Piston（官方镜像，无需定制）
  # 后端启动后会自动通过 Piston 的 HTTP API 安装 cpp / python 运行时
  # ---------------------------------------------------------------
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: codepad-piston
    restart: unless-stopped
    # Piston 官方要求：isolate 沙箱需要特权模式（自托管场景，见官方 docker-compose）
    privileged: true
    # 沙箱执行引擎仅绑定宿主机回环地址：
    # 后端通过 Docker 内网(http://piston:2000)调用它，公网无需暴露（安全考虑）
    ports:
      - "127.0.0.1:2000:2000"
    tmpfs:
      - /tmp:exec
    volumes:
      - piston_packages:/piston/packages
    environment:
      # 与需求一致：运行/编译超时上限 10 秒（默认仅 3 秒）
      PISTON_COMPILE_TIMEOUT: 10000
      PISTON_RUN_TIMEOUT: 10000
      # stdout 上限（默认仅 1024 字符，学生程序输出容易超，放宽到 100KB）
      PISTON_OUTPUT_MAX_SIZE: 100000
      PISTON_MAX_PROCESS_COUNT: 128
      # 国内服务器可在 .env 中把运行时下载源换成镜像代理（如 ghproxy），
      # 或用 Docker Desktop 的代理设置（对所有容器出网生效，推荐）
      PISTON_REPO_URL: ${PISTON_REPO_URL:-https://github.com/engineer-man/piston/releases/download/pkgs/index}
    # 执行引擎不设硬内存上限：编译大程序需要峰值余量，交由系统 swap 兜底
    # （硬 cap 会在 OOM 时杀死整个容器，损失更大）
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------
  # 自定义 Python 环境构建器：把用户选择的第三方库 pip 进共享卷
  # 的运行时 site-packages（与 Piston 同为 glibc，使用 manylinux 轮子）
  # ---------------------------------------------------------------
  env-builder:
    # 自建镜像：构建时先升级 pip（消除版本警告，层可缓存复用）
    build: ./env-builder
    image: codepad-lite-env-builder
    container_name: codepad-env-builder
    restart: unless-stopped
    volumes:
      - piston_packages:/pkgs
    environment:
      PORT: 3100
      # 国内服务器可换成清华镜像：https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    expose:
      - "3100"
    mem_limit: 768m # 普通 compose 下真正生效的内存上限（deploy.resources 仅在 swarm 生效）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:3100/health',timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------
  # 后端：Express + SQLite + JWT，通过 HTTP 调用 piston /api/v2/execute
  # ---------------------------------------------------------------
  backend:
    build: ./backend
    container_name: codepad-backend
    restart: unless-stopped
    depends_on:
      piston:
        condition: service_healthy
      env-builder:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-codepad-lite-dev-secret-change-me}
      # 硬编码管理员 xiaopac 的初始密码（仅首次创建时生效，生产务必修改）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PISTON_URL: http://piston:2000
      ENV_BUILDER_URL: http://env-builder:3100
      TERM_RUNNER_URL: http://term-runner:4100
      # 每用户同时可持有的交互终端会话数
      TERM_SESSIONS_PER_USER: ${TERM_SESSIONS_PER_USER:-2}
      DB_PATH: /app/data/codepad.db
      STORAGE_DIR: /app/storage
      LOG_DIR: /app/logs
    volumes:
      - db_data:/app/data
      - storage_data:/app/storage
      - logs_data:/app/logs
    networks:
      - default
      - termnet
    mem_limit: 512m # 后端实际占用约 100MB，留足余量
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------
  # 交互式终端沙箱（隐藏页 /web，仅管理员）：node-pty 伪终端会话
  # 只挂 internal 网络：沙箱内进程无法访问外网（安全设计）
  # ---------------------------------------------------------------
  term-runner:
    build: ./term-runner
    container_name: codepad-term-runner
    restart: unless-stopped
    environment:
      PORT: 4100
      MAX_SESSIONS: ${TERM_MAX_SESSIONS:-30}
    tmpfs:
      - /tmp:size=256m,mode=1777 # 会话目录：内存盘，重启即清空
    security_opt:
      - no-new-privileges:true
    networks:
      - termnet
    mem_limit: 768m # 20 个会话 × ulimit 512MB 为峰值理论值；实际由会话数与闲置回收控制
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------
  # 前端：nginx 托管静态资源，并把 /api 反代到后端（同源，无 CORS 烦恼）
  # ---------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: codepad-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    mem_limit: 128m # nginx 静态托管，占用极小
    healthcheck:
      # 注意：容器内 localhost 解析为 ::1，而 nginx 仅监听 IPv4，须显式用 127.0.0.1
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 15s

volumes:
  piston_packages:
  db_data:
  storage_data:
  logs_data:

networks:
  # 终端沙箱专用内网：internal = 无外网出口（沙箱进程无法联网）
  termnet:
    internal: true
