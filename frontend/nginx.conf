server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;
    gzip_min_length 1024;
    gzip_comp_level 5;      # 默认 1：提高到 5 换来明显更小的传输体积
    gzip_vary on;           # 正确告知 CDN/代理：按 Accept-Encoding 区分缓存
    gzip_proxied any;

    # 静态文件句柄缓存：命中直接读缓存，减少 open/stat 系统调用
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ── 内容安全策略（需求 1.3）──────────────────────────────
    # 在 HTML 响应上统一设置 CSP；'unsafe-inline' 仅限样式（Monaco 动态注入 <style>），
    # 脚本严格 'self'（生产包为外部文件，无内联脚本）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # 仅 HTTPS 生效（浏览器忽略 HTTP 上的 HSTS）；与后端 helmet 既有的下发布局保持一致
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 关闭本站用不到的浏览器能力，缩小攻击面；剪贴板复制（构建日志）显式保留
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), clipboard-write=(self)" always;

    # 前端容器反代后端，浏览器端统一同源访问 /api
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket（交互式终端 /api/terminal/ws）：升级头 + 长超时
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 30m;  # 多媒体上传（base64，≤15MB 原始文件）
        # 隐藏上游同名头，由 nginx 统一输出单一值（避免 nosniff,nosniff 这类合并）
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
    }

    # 静态资源长缓存（带 hash 的文件名，可安全缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML 入口始终回源校验：避免旧 index.html 引用已被替换的 hash 资源而白屏。
    # 用 expires 而非 add_header（add_header 会覆盖继承的安全响应头，导致 CSP 丢失）。
    location = /index.html {
        expires -1;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
